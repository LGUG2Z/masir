[package]
name = "masir"
authors = ["LGUG2Z"]
version = "0.2.0"
edition = "2021"
license-file = "LICENSE.md"

[dependencies]
winput = "0.2"
color-eyre = "0.6"
paste = "1"
ctrlc = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-core = "0.62"
dirs = "6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
parking_lot = "0.12"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
]
